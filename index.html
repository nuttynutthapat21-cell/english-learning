

<!DOCTYPE html>

  <title>คำศัพท์ | SpeakUp</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="english.css">
  <link rel="stylesheet" href="theme.css">

<body>

  <nav id="mainNav">
    <a href="index.html">หน้าแรก</a>
    <a href="english.html">คำศัพท์</a>
    <a href="dialogue.html">บทสนทนา</a>
    <button id="themeBtn">🌙</button>
  </nav>
  <header class="hero">
    <h1>พูดภาษาอังกฤษให้ได้ ทีละนิดทุกวัน</h1>
    <p>ฟัง พูด และฝึกกับสถานการณ์จริง</p>
  </header>

  <main>
    <section class="stats">
      <div class="stat">
        <span class="stat-number" id="streak">0</span>
        <span>วันติดต่อกัน 🔥</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="todayCount">0</span>
        <span>ครั้งที่ฝึกวันนี้</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="totalScore">0</span>
        <span>คะแนนรวม</span>
      </div>
    </section>

    <section class="goal">
      <p id="goalText"></p>
      <div class="bar"><div id="goalFill" class="fill"></div></div>
    </section>

    <section class="lessons">
      <a class="lesson" href="english.html">
        <h3>📚 คำศัพท์</h3>
        <p>แฟลชการ์ด ฟังเสียง ทดสอบ และฝึกออกเสียง</p>
      </a>
      <a class="lesson" href="dialogue.html">
        <h3>💬 บทสนทนา</h3>
        <p>สวมบทบาทในสถานการณ์จริง เช่น สั่งอาหาร ถามทาง</p>
      </a>
    </section>
  </main>
